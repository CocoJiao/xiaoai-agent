name: Build XiaoAI Agent

on:
  push:
    branches:
      - main
      # 集成分支：合并动作本身也要有 CI。否则「每个 PR 各自绿」不等于
      # 「合并后整体绿」——语义冲突只在合并后才会暴露。
      - "integration/**"
    tags:
      - "v*"
    paths:
      - ".github/workflows/build-agent.yml"
      - "xiaoai-agent/**"
  pull_request:
    branches:
      - main
      # 集成分支：issue #10-#19 的各个 PR 都指向这里。不写这一行，
      # 指向集成分支的 PR 一个 check 都不会跑，看起来「没报错」其实是没测。
      - "integration/**"
    paths:
      - ".github/workflows/build-agent.yml"
      - "xiaoai-agent/**"
  workflow_dispatch:

permissions:
  contents: read

env:
  RUST_TOOLCHAIN: "1.96.0"
  RUST_TARGET: armv7-unknown-linux-gnueabihf
  ZIGBUILD_TARGET: armv7-unknown-linux-gnueabihf.2.25
  AGENT_DIR: xiaoai-agent

jobs:
  build-agent:
    name: Build ARMv7 binary
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 部署脚本不走 rustc：语法错误只有上机才发现（CRLF 那次就是这样）。
      # bash -n 零成本，能在 CI 里挡掉整类问题。
      - name: Shell syntax check
        run: |
          bash -n xiaoai-agent/start-agent.sh
          bash -n deploy/client-patch/src/build.sh
          bash -n deploy/client-patch/src/extract.sh

      - name: Install Rust
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal
          rustup target add "$RUST_TARGET" --toolchain "$RUST_TOOLCHAIN"

      - name: Install Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      - name: Install cargo-zigbuild
        run: cargo +"$RUST_TOOLCHAIN" install cargo-zigbuild --locked --version 0.23.0

      - name: Check
        working-directory: ${{ env.AGENT_DIR }}
        run: cargo +"$RUST_TOOLCHAIN" check --locked --bin xiaoai-agent

      - name: Test
        working-directory: ${{ env.AGENT_DIR }}
        run: cargo +"$RUST_TOOLCHAIN" test --locked --bin xiaoai-agent

      - name: Build release binary
        working-directory: ${{ env.AGENT_DIR }}
        run: cargo +"$RUST_TOOLCHAIN" zigbuild --release --locked --target "$ZIGBUILD_TARGET" --bin xiaoai-agent

      - name: Inspect binary
        working-directory: ${{ env.AGENT_DIR }}
        run: |
          file "target/$RUST_TARGET/release/xiaoai-agent"
          ls -lh "target/$RUST_TARGET/release/xiaoai-agent"

      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: xiaoai-agent-armv7-glibc-2.25
          path: xiaoai-agent/target/armv7-unknown-linux-gnueabihf/release/xiaoai-agent
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: build-agent
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      actions: read
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download binary artifact
        uses: actions/download-artifact@v4
        with:
          name: xiaoai-agent-armv7-glibc-2.25
          path: dist

      - name: Publish release asset
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          chmod +x dist/xiaoai-agent

          tag="$GITHUB_REF_NAME"
          asset="dist/xiaoai-agent#xiaoai-agent-armv7-glibc-2.25"
          cat > release-notes.md <<'EOF'
          XiaoAI Agent ARMv7 binary for OH2P.

          Target: armv7-unknown-linux-gnueabihf.2.25
          Firmware tested by this project: OH2P 1.62.2
          EOF

          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" "$asset" --clobber
          else
            gh release create "$tag" "$asset" \
              --title "$tag" \
              --notes-file release-notes.md \
              --verify-tag
          fi
